<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Excel → Intervals.icu</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #fff; --text: #1d2330; --muted: #6b7280;
    --line: #e3e6eb; --accent: #e8462a; --accent-2: #c5361d; --ok: #1f9d55;
    --warn-bg: #fff6e0; --warn: #8a5a00; --err-bg: #fdecec; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b1f27; --text: #e6e8ec; --muted: #9aa1ad;
      --line: #2c323d; --warn-bg: #3a2f12; --warn: #f5c76b; --err-bg: #3b1717; --err: #ff8f85;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  h2 { font-size: 17px; margin: 28px 0 10px; }
  p.sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select, textarea { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
  textarea { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; min-height: 120px; resize: vertical; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; background: var(--accent); color: #fff; }
  button:hover { background: var(--accent-2); }
  button:disabled { opacity: .5; cursor: default; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 10px; font-weight: 500; }
  #drop { border: 2px dashed var(--line); border-radius: 10px; padding: 26px; text-align: center; cursor: pointer; flex: 1 1 320px; }
  #drop.over { border-color: var(--accent); }
  #drop strong { color: var(--accent); }
  .status { margin-top: 14px; padding: 10px 12px; border-radius: 8px; display: none; }
  .status.show { display: block; }
  .status.err { background: var(--err-bg); color: var(--err); }
  .status.info { background: var(--bg); color: var(--muted); }
  .status.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
  .warnings { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 14px; margin-bottom: 14px; }
  .warnings ul { margin: 4px 0 0; padding-left: 18px; }
  .athlete-group { margin-bottom: 22px; }
  .athlete-group > h3 { font-size: 15px; margin: 0 0 8px; }
  .w { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .w.off { opacity: .45; }
  .w-grid { display: grid; grid-template-columns: 1.4fr 1fr 1fr 2fr auto; gap: 10px; align-items: end; }
  .w-warn { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 6px 10px; font-size: 13px; margin-top: 10px; }
  .w textarea { margin-top: 10px; }
  .inc { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); white-space: nowrap; margin-bottom: 9px; }
  .inc input { width: auto; }
  .bar { position: sticky; bottom: 0; background: var(--bg); padding: 14px 0; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (max-width: 760px) { .w-grid { grid-template-columns: 1fr 1fr; } .w-grid .name { grid-column: 1 / -1; } }
</style>
</head>
<body>
<main>
  <h1>Excel → Intervals.icu</h1>
  <p class="sub">Sube el Excel con los entrenos de la semana, revisa lo que ha entendido la IA y prográmalo en el calendario de cada atleta.</p>

  <section class="card">
    <div class="row">
      <div id="drop">
        <input type="file" id="file" accept=".xlsx,.xlsm,.csv" hidden>
        <div id="dropText"><strong>Elige el Excel</strong> o arrástralo aquí<br><small>.xlsx o .csv</small></div>
      </div>
      <div style="flex: 0 1 200px">
        <label for="week">Lunes de la semana</label>
        <input type="date" id="week">
      </div>
      <div><button id="parseBtn" disabled>Interpretar entrenos</button></div>
    </div>
    <div id="status" class="status"></div>
  </section>

  <section id="review" hidden>
    <h2>Revisa los entrenos</h2>
    <div id="generalWarnings"></div>
    <div id="list"></div>
    <div class="bar">
      <span id="summary"></span>
      <button id="uploadBtn">Subir a Intervals.icu</button>
    </div>
    <div id="uploadStatus" class="status"></div>
  </section>
</main>

<script>
const SPORTS = {Run:"Carrera", Ride:"Bici", VirtualRide:"Rodillo", Swim:"Natación", WeightTraining:"Fuerza", Walk:"Caminar", Hike:"Montaña", Rowing:"Remo", Yoga:"Yoga", NordicSki:"Esquí nórdico", Workout:"Otro"};
const $ = s => document.querySelector(s);
let athletes = [], workouts = [], file = null;

function nextMonday() {
  const d = new Date(); const day = d.getDay();
  d.setDate(d.getDate() + ((8 - day) % 7 || 7));
  return d.toISOString().slice(0, 10);
}
$("#week").value = nextMonday();

function status(el, kind, html) { el.className = "status show " + kind; el.innerHTML = html; }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const drop = $("#drop");
drop.onclick = () => $("#file").click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); setFile(e.dataTransfer.files[0]); };
$("#file").onchange = e => setFile(e.target.files[0]);
function setFile(f) {
  if (!f) return;
  file = f;
  $("#dropText").innerHTML = `<strong>${esc(f.name)}</strong><br><small>Haz clic para cambiarlo</small>`;
  $("#parseBtn").disabled = false;
}

async function api(url, opts) {
  const r = await fetch(url, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || `Error ${r.status}`);
  return data;
}

$("#parseBtn").onclick = async () => {
  const btn = $("#parseBtn"); btn.disabled = true;
  $("#review").hidden = true;
  status($("#status"), "info", '<span class="spinner"></span>Leyendo el Excel e interpretando los entrenos… puede tardar un minuto.');
  try {
    const fd = new FormData(); fd.append("file", file); fd.append("week_start", $("#week").value);
    const data = await api("/api/parse", {method: "POST", body: fd});
    athletes = data.athletes;
    workouts = data.workouts.map(w => ({...w, include: true}));
    workouts.sort((a, b) => a.date.localeCompare(b.date));
    $("#generalWarnings").innerHTML = data.general_warnings.length
      ? `<div class="warnings"><strong>A revisar:</strong><ul>${data.general_warnings.map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>` : "";
    render();
    $("#review").hidden = false;
    status($("#status"), "ok", `He encontrado ${workouts.length} entrenos. Revísalos abajo antes de subirlos.`);
  } catch (e) {
    status($("#status"), "err", esc(e.message));
  } finally { btn.disabled = false; }
};

function athleteName(id) { return athletes.find(a => a.id === id)?.name; }

function render() {
  const groups = {};
  workouts.forEach((w, i) => { const k = w.athlete_id || ""; (groups[k] ||= []).push(i); });
  const keys = Object.keys(groups).sort((a, b) => (a === "" ? -1 : b === "" ? 1 : (athleteName(a) || "").localeCompare(athleteName(b) || "")));
  $("#list").innerHTML = keys.map(k => `
    <div class="athlete-group">
      <h3>${k ? esc(athleteName(k)) : "⚠️ Sin atleta asignado"} · ${groups[k].length} entrenos</h3>
      ${groups[k].map(card).join("")}
    </div>`).join("") || "<p>No se ha encontrado ningún entreno.</p>";
  summary();
}

function card(i) {
  const w = workouts[i];
  const athOpts = `<option value="">— Elige atleta —</option>` + athletes.map(a => `<option value="${esc(a.id)}" ${a.id === w.athlete_id ? "selected" : ""}>${esc(a.name)}</option>`).join("");
  const sportOpts = Object.entries(SPORTS).map(([v, l]) => `<option value="${v}" ${v === w.sport ? "selected" : ""}>${l}</option>`).join("");
  const day = w.date ? new Date(w.date + "T12:00").toLocaleDateString("es-ES", {weekday: "long"}) : "";
  return `<div class="w ${w.include ? "" : "off"}" data-i="${i}">
    <div class="w-grid">
      <div><label>Atleta${w.athlete_name_in_excel ? ` (Excel: ${esc(w.athlete_name_in_excel)})` : ""}</label><select data-f="athlete_id">${athOpts}</select></div>
      <div><label>Fecha · ${esc(day)}</label><input type="date" data-f="date" value="${esc(w.date)}"></div>
      <div><label>Deporte</label><select data-f="sport">${sportOpts}</select></div>
      <div class="name"><label>Nombre</label><input data-f="name" value="${esc(w.name)}"></div>
      <label class="inc"><input type="checkbox" data-f="include" ${w.include ? "checked" : ""}> Subir</label>
    </div>
    <textarea data-f="description" spellcheck="false">${esc(w.description)}</textarea>
    ${w.warning ? `<div class="w-warn">⚠️ ${esc(w.warning)}</div>` : ""}
  </div>`;
}

$("#list").addEventListener("change", e => {
  const el = e.target, box = el.closest(".w"); if (!box || !el.dataset.f) return;
  const w = workouts[+box.dataset.i];
  w[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value;
  if (el.dataset.f === "athlete_id" || el.dataset.f === "include" || el.dataset.f === "date") render(); else summary();
});
$("#list").addEventListener("input", e => {
  const el = e.target, box = el.closest(".w"); if (!box || !el.dataset.f || el.type === "checkbox") return;
  workouts[+box.dataset.i][el.dataset.f] = el.value;
});

function summary() {
  const sel = workouts.filter(w => w.include);
  const missing = sel.filter(w => !w.athlete_id).length;
  const n = new Set(sel.map(w => w.athlete_id).filter(Boolean)).size;
  $("#summary").textContent = `${sel.length} entrenos para ${n} atleta(s)` + (missing ? ` · ${missing} sin atleta` : "");
  $("#uploadBtn").disabled = !sel.length || missing > 0;
}

$("#uploadBtn").onclick = async () => {
  const sel = workouts.filter(w => w.include);
  const n = new Set(sel.map(w => w.athlete_id)).size;
  if (!confirm(`¿Subir ${sel.length} entrenos a los calendarios de ${n} atleta(s) en Intervals.icu?`)) return;
  const btn = $("#uploadBtn"); btn.disabled = true;
  status($("#uploadStatus"), "info", '<span class="spinner"></span>Subiendo a Intervals.icu…');
  try {
    const data = await api("/api/upload", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({workouts: sel.map(({athlete_id, date, sport, name, description}) => ({athlete_id, date, sport, name, description}))})});
    const ok = data.results.filter(r => r.ok), bad = data.results.filter(r => !r.ok);
    let html = ok.map(r => `✅ ${esc(athleteName(r.athlete_id))}: ${r.count} entrenos programados`).join("<br>");
    if (bad.length) html += (html ? "<br>" : "") + bad.map(r => `❌ ${esc(athleteName(r.athlete_id))}: ${esc(r.error)}`).join("<br>");
    status($("#uploadStatus"), bad.length ? "err" : "ok", html);
  } catch (e) {
    status($("#uploadStatus"), "err", esc(e.message));
  } finally { btn.disabled = false; }
};
</script>
</body>
</html>
